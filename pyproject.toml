[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coderadio-on-tray"
dynamic = ["version"]
description = "Unofficial FreeCodeCamp Code Radio system tray player"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "coderadio-on-tray contributors" }]
dependencies = [
  "PySide6>=6.6",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pyinstaller>=6.0",
  "pytest>=8.0",
  "ruff>=0.5",
]
macos = [
  "pyobjc-core>=10.0; sys_platform == 'darwin'",
  "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
]

[project.scripts]
coderadio-tray = "coderadio_tray.__main__:main"

[project.gui-scripts]
coderadio-tray-gui = "coderadio_tray.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/coderadio_tray"]

[tool.hatch.build.targets.sdist]
include = ["src/coderadio_tray", "docs", "README.md", "pyproject.toml"]

[tool.hatch.version]
path = "src/coderadio_tray/__init__.py"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
  "E501",  # line length handled by formatter; ruff format wouldn't reflow long strings
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
