[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coderadio-on-tray"
version = "0.2.0"
description = "Unofficial FreeCodeCamp Code Radio system tray player"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "coderadio-on-tray contributors" }]
dependencies = [
  "PySide6>=6.6",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pyinstaller>=6.0",
  "pytest>=8.0",
]
macos = [
  "pyobjc-core>=10.0; sys_platform == 'darwin'",
  "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
]

[project.scripts]
coderadio-tray = "coderadio_tray.__main__:main"

[project.gui-scripts]
coderadio-tray-gui = "coderadio_tray.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/coderadio_tray"]

[tool.hatch.build.targets.sdist]
include = ["src/coderadio_tray", "docs", "README.md", "pyproject.toml"]
